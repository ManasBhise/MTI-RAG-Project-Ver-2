# ==============================================================================
# IMD Physical Server - Apache Reverse Proxy Configuration
# Place this in /etc/apache2/sites-available/mti-assistant.conf (Ubuntu/Debian)
# or in /etc/httpd/conf.d/mti-assistant.conf (RHEL/CentOS)
# ==============================================================================

# ==============================================================================
# OPTION A: Dedicated Subdomain (Recommended) -> assistant.imd.gov.in
# ==============================================================================
<VirtualHost *:80>
    ServerName assistant.imd.gov.in
    
    # Redirect HTTP to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName assistant.imd.gov.in

    # SSL Configuration (Update paths to IMD's SSL certificate files)
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/imd_certificate.crt
    SSLCertificateKeyFile /etc/ssl/private/imd_private.key
    # SSLCertificateChainFile /etc/ssl/certs/imd_chain.crt

    # Reverse Proxy to MTI Frontend Container (Port 3000)
    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    # Direct Proxy to Backend Container for API docs (Optional)
    # ProxyPass /docs http://127.0.0.1:8000/docs
    # ProxyPassReverse /docs http://127.0.0.1:8000/docs

    # Request header forwarding
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ErrorLog ${APACHE_LOG_DIR}/mti_assistant_error.log
    CustomLog ${APACHE_LOG_DIR}/mti_assistant_access.log combined
</VirtualHost>


# ==============================================================================
# OPTION B: Sub-path on Existing Main Website -> www.imd.gov.in/mti-assistant/
# (Insert this block inside your existing <VirtualHost *:443> block for imd.gov.in)
# ==============================================================================
#
#   # Proxy MTI Assistant Frontend and API to Docker
#   ProxyPreserveHost On
#   ProxyRequests Off
#
#   ProxyPass /mti-assistant/ http://127.0.0.1:3000/
