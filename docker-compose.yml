# ==============================================================================
# MTI Knowledge Assistant - Production Docker Compose Configuration
# ==============================================================================

services:
  # Backend API & RAG Vector Engine
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mti-assistant-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
      - path: ./.env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - RAG_DATA_DIR=/app/data
      - RAG_VECTOR_STORE_DIR=/app/rag/store
      - DATABASE_URL=sqlite:////app/data/mti_assistant.db
      - PRIMARY_LLM_PROVIDER=groq
      - GROQ_MODEL=openai/gpt-oss-120b
    volumes:
      - ./data:/app/data
      - ./rag/store:/app/rag/store
      - ./backend:/app/backend
      - ./rag:/app/rag
    networks:
      - mti-network

  # Frontend UI & Nginx Reverse Proxy (Exposed to IMD Apache Web Server)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: mti-assistant-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - mti-network

networks:
  mti-network:
    driver: bridge
